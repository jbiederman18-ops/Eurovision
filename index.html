<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurovision 2026 Live Rating</title>
    <!-- Tailwind CSS for Beautiful Styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: linear-gradient(135deg, #110022 0%, #220044 100%);
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="py-6 text-center border-b border-purple-900/50 bg-black/20 structural-header">
        <h1 class="text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-yellow-400">
            🎤 EUROVISION 2026 LIVE
        </h1>
        <p class="text-sm text-purple-300 mt-1 tracking-widest uppercase">Grand Final Watch Party Scoreboard</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Column: Voting Panel -->
        <section class="bg-white/5 border border-purple-500/20 rounded-2xl p-6 backdrop-blur-md shadow-xl">
            <h2 class="text-2xl font-bold text-pink-500 mb-6 flex items-center gap-2">
                🎵 Rate Performance
            </h2>
            
            <form id="voteForm" class="space-y-6">
                <!-- User Selector -->
                <div>
                    <label class="block text-sm font-semibold text-purple-300 mb-2">Who Are You?</label>
                    <select id="userSelect" class="w-full bg-purple-950/50 border border-purple-500/30 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                        <option value="Alice">Alice</option>
                        <option value="Bob">Bob</option>
                        <option value="Charlie">Charlie</option>
                        <option value="Dave">Dave</option>
                        <option value="Emma">Emma</option>
                        <option value="Frank">Frank</option>
                        <option value="Grace">Grace</option>
                        <option value="Henry">Henry</option>
                    </select>
                </div>

                <!-- Country/Song Selector -->
                <div>
                    <label class="block text-sm font-semibold text-purple-300 mb-2">Select Act</label>
                    <select id="actSelect" class="w-full bg-purple-950/50 border border-purple-500/30 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                        <!-- Add your watch order list here manually -->
                        <option value="Sweden|Dance Alone" data-country="Sweden" data-song="Dance Alone">🇸🇪 Sweden — "Dance Alone"</option>
                        <option value="Italy|La Noia" data-country="Italy" data-song="La Noia">🇮🇹 Italy — "La Noia"</option>
                        <option value="United Kingdom|Dizzy" data-country="United Kingdom" data-song="Dizzy">🇬🇧 United Kingdom — "Dizzy"</option>
                        <option value="Spain|Zorra" data-country="Spain" data-song="Zorra">🇪🇸 Spain — "Zorra"</option>
                        <option value="Ukraine|Teresa & Maria" data-country="Ukraine" data-song="Teresa & Maria">🇺🇦 Ukraine — "Teresa & Maria"</option>
                    </select>
                </div>

                <!-- Rating Slider -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-purple-300">Your Score</label>
                        <span id="sliderValue" class="text-2xl font-black text-yellow-400 bg-yellow-400/10 px-3 py-1 rounded-lg border border-yellow-400/30">12</span>
                    </div>
                    <input type="range" id="scoreSlider" min="1" max="12" value="12" class="w-full accent-pink-500 h-2 bg-purple-950 rounded-lg cursor-pointer">
                    <div class="flex justify-between text-xs text-gray-400 px-1 mt-1">
                        <span>1 (Flop)</span>
                        <span>6</span>
                        <span>12 (Douze Points!)</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-yellow-400 hover:to-orange-500 text-white hover:text-purple-950 font-bold py-4 rounded-xl transition duration-300 transform hover:scale-[1.02] shadow-lg shadow-pink-500/20 cursor-pointer">
                    Submit Score 🚀
                </button>
            </form>
        </section>

        <!-- Right Column: Live Leaderboard / Standings -->
        <section class="bg-white/5 border border-purple-500/20 rounded-2xl p-6 backdrop-blur-md shadow-xl flex flex-col justify-between">
            <div>
                <h2 class="text-2xl font-bold text-yellow-400 mb-6 flex items-center justify-between">
                    <span>🏆 Group Leaderboard</span>
                    <button onclick="fetchLeaderboard()" class="text-xs bg-purple-500/20 hover:bg-purple-500/40 text-purple-300 px-3 py-1 rounded-full border border-purple-500/30 cursor-pointer transition">
                        🔄 Refresh Sync
                    </button>
                </h2>

                <!-- Live Standings Content -->
                <div class="overflow-hidden rounded-xl border border-purple-500/10">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-purple-950/80 text-purple-300 text-xs tracking-wider uppercase border-b border-purple-500/20">
                                <th class="p-4">Rank</th>
                                <th class="p-4">Country</th>
                                <th class="p-4 text-right">Avg Score ⭐</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody" class="divide-y divide-purple-500/10 text-sm">
                            <!-- Rows will be injected dynamically via JavaScript -->
                            <tr>
                                <td colspan="3" class="p-8 text-center text-gray-400 italic">Submit votes to generate live scoreboard...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Embedded fallback View -->
            <div class="mt-6 pt-4 border-t border-purple-500/20 text-center">
                <a href="#" id="sheetLink" target="_blank" class="text-xs text-purple-400 hover:text-pink-400 underline">
                    Open Raw Google Sheet Data ↗️
                </a>
            </div>
        </section>
    </main>

    <!-- JavaScript logic -->
    <script>
        // Update slider number indicator interactively
        const slider = document.getElementById('scoreSlider');
        const sliderValue = document.getElementById('sliderValue');
        slider.addEventListener('input', (e) => {
            sliderValue.textContent = e.target.value;
        });

        // --- SUBMISSION LOGIC ---
        document.getElementById('voteForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('userSelect').value;
            const actOption = document.getElementById('actSelect').options[document.getElementById('actSelect').selectedIndex];
            const country = actOption.getAttribute('data-country');
            const song = actOption.getAttribute('data-song');
            const score = slider.value;

            // Replace with your Google Form Submit URL
            const FORM_URL = "https://docs.google.com/forms/u/0/d/e/YOUR_FORM_ID_HERE/formResponse";

            // Construct form payload data using your Form Entry IDs
            const formData = new FormData();
            formData.append('entry.111111111', user);      // Replace with User Entry ID
            formData.append('entry.222222222', country);   // Replace with Country Entry ID
            formData.append('entry.333333333', song);      // Replace with Song Entry ID
            formData.append('entry.444444444', score);     // Replace with Rating Entry ID

            // Send raw pre-filled submit request quietly via browser background
            fetch(FORM_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                alert(`Successfully sent ${score} points for ${country}!`);
                setTimeout(fetchLeaderboard, 1500); // Trigger leaderboard recalculation slightly after submission
            })
            .catch(err => {
                console.error("Submission failed:", err);
                alert("Error sending vote. Verify configuration URLs.");
            });
        });

        // --- LIVE SYNC LEADERBOARD LOGIC ---
        function fetchLeaderboard() {
            // OPTIONAL ADVANCED TRICK: To make the leaderboard calculate directly on your screen automatically 
            // without a backend server, you can publish your Google Sheet as a CSV web link 
            // via File > Share > Publish to Web (Select CSV option) and fetch it right here to calculate math!
            console.log("Sync requested.");
        }
    </script>
</body>
</html>
