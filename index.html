<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurovision 2026 Live Rating</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background: linear-gradient(135deg, #110022 0%, #220044 100%); }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="py-6 text-center border-b border-purple-900/50 bg-black/20">
        <h1 class="text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-yellow-400">
            🎤 EUROVISION 2026 LIVE
        </h1>
        <p class="text-sm text-purple-300 mt-1 tracking-widest uppercase">Grand Final Watch Party Scoreboard</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Column: Voting Panel -->
        <section class="bg-white/5 border border-purple-500/20 rounded-2xl p-6 backdrop-blur-md shadow-xl">
            <h2 class="text-2xl font-bold text-pink-500 mb-6 flex items-center gap-2">🎵 Rate Performance</h2>
            
            <form id="voteForm" class="space-y-6">
                <!-- User Selector -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-purple-300">Who Are You?</label>
                        <span id="savedBadge" class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded border border-green-500/30 hidden">Remembered ✨</span>
                    </div>
                    <select id="userSelect" class="w-full bg-purple-950/50 border border-purple-500/30 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                        <option value="" disabled selected>Choose your name...</option>
                        <option value="Connor">Connor</option>
                        <option value="Sarah">Sarah</option>
                        <option value="Mads">Mads</option>
                        <option value="Josh">Josh</option>
                        <option value="Maria">Maria</option>
                        <option value="Sam">Sam</option>
                        <option value="Erik">Erik</option>
                        <option value="Ryan">Ryan</option>
                    </select>
                </div>

                <!-- Country Selector (In official 2026 Grand Final Running Order) -->
                <div>
                    <label class="block text-sm font-semibold text-purple-300 mb-2">Select Country</label>
                    <select id="actSelect" class="w-full bg-purple-950/50 border border-purple-500/30 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                        <option value="Denmark">01. 🇩🇰 Denmark</option>
                        <option value="Germany">02. 🇩🇪 Germany</option>
                        <option value="Israel">03. 🇮🇱 Israel</option>
                        <option value="Belgium">04. 🇧🇪 Belgium</option>
                        <option value="Albania">05. 🇦🇱 Albania</option>
                        <option value="Greece">06. 🇬🇷 Greece</option>
                        <option value="Ukraine">07. 🇺🇦 Ukraine</option>
                        <option value="Australia">08. 🇦🇺 Australia</option>
                        <option value="Serbia">09. 🇷🇸 Serbia</option>
                        <option value="Malta">10. 🇲🇹 Malta</option>
                        <option value="Czechia">11. 🇨🇿 Czechia</option>
                        <option value="Bulgaria">12. 🇧🇬 Bulgaria</option>
                        <option value="Croatia">13. 🇭🇷 Croatia</option>
                        <option value="United Kingdom">14. 🇬🇧 United Kingdom</option>
                        <option value="France">15. 🇫🇷 France</option>
                        <option value="Moldova">16. 🇲🇩 Moldova</option>
                        <option value="Finland">17. 🇫🇮 Finland</option>
                        <option value="Poland">18. 🇵🇱 Poland</option>
                        <option value="Lithuania">19. 🇱🇹 Lithuania</option>
                        <option value="Sweden">20. 🇸🇪 Sweden</option>
                        <option value="Cyprus">21. 🇨🇾 Cyprus</option>
                        <option value="Italy">22. 🇮🇹 Italy</option>
                        <option value="Norway">23. 🇳🇴 Norway</option>
                        <option value="Romania">24. 🇷🇴 Romania</option>
                        <option value="Austria">25. 🇦🇹 Austria</option>
                    </select>
                </div>

                <!-- Rating Slider -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-purple-300">Your Score</label>
                        <span id="sliderValue" class="text-2xl font-black text-yellow-400 bg-yellow-400/10 px-3 py-1 rounded-lg border border-yellow-400/30">12</span>
                    </div>
                    <input type="range" id="scoreSlider" min="1" max="12" value="12" class="w-full accent-pink-500 h-2 bg-purple-950 rounded-lg cursor-pointer">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-yellow-400 hover:to-orange-500 text-white hover:text-purple-950 font-bold py-4 rounded-xl transition duration-300 transform hover:scale-[1.02] shadow-lg shadow-pink-500/20 cursor-pointer">
                    Submit Score 🚀
                </button>
            </form>
        </section>

        <!-- Right Column: Live Leaderboard -->
        <section class="bg-white/5 border border-purple-500/20 rounded-2xl p-6 backdrop-blur-md shadow-xl">
            <h2 class="text-2xl font-bold text-yellow-400 mb-6 flex items-center justify-between">
                <span>🏆 Group Leaderboard</span>
                <button onclick="fetchLeaderboard()" class="text-xs bg-purple-500/20 hover:bg-purple-500/40 text-purple-300 px-3 py-1 rounded-full border border-purple-500/30 cursor-pointer">🔄 Refresh Sync</button>
            </h2>

            <div class="overflow-hidden rounded-xl border border-purple-500/10">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-purple-950/80 text-purple-300 text-xs tracking-wider uppercase border-b border-purple-500/20">
                            <th class="p-4">Rank</th>
                            <th class="p-4">Country</th>
                            <th class="p-4 text-right">Avg Score ⭐</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody" class="divide-y divide-purple-500/10 text-sm">
                        <tr><td colspan="3" class="p-8 text-center text-gray-400 italic">Syncing live scoreboard data...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // ⚠️ PASTE YOUR SHEETDB API URL HERE:
        const API_URL = "https://sheetdb.io/api/v1/gwqc9f3gpod2k";

        const userSelect = document.getElementById('userSelect');
        const savedBadge = document.getElementById('savedBadge');
        const slider = document.getElementById('scoreSlider');
        const sliderValue = document.getElementById('sliderValue');

        // Remember the user via LocalStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('eurovision_user');
            if (savedUser) {
                userSelect.value = savedUser;
                savedBadge.classList.remove('hidden'); 
            }
            fetchLeaderboard();
            setInterval(fetchLeaderboard, 15000); // Auto-refresh leaderboard every 15 seconds
        });

        userSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                localStorage.setItem('eurovision_user', e.target.value);
                savedBadge.classList.remove('hidden');
            }
        });

        slider.addEventListener('input', (e) => { sliderValue.textContent = e.target.value; });

        // --- SUBMISSION VIA NATIVE API ---
        document.getElementById('voteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = userSelect.value;
            if (!user) { alert("Please select your name before voting!"); return; }

            const country = document.getElementById('actSelect').value;
            const score = parseInt(slider.value);

            // Send clean JSON straight to the Google Sheet API via SheetDB
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [{ user: user, country: country, rating: score }] })
            })
            .then(res => res.json())
            .then(() => {
                alert(`Vote registered! Sent ${score} points to ${country}.`);
                slider.value = 12;
                sliderValue.textContent = 12;
                fetchLeaderboard(); // Update scoreboard right away
            })
            .catch(err => { console.error("API error:", err); alert("Error saving vote."); });
        });

        // --- SYNC LEADERBOARD FROM API ---
        function fetchLeaderboard() {
            fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('leaderboardBody').innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-400 italic">No votes submitted yet!</td></tr>`;
                    return;
                }

                const totals = {};
                data.forEach(row => {
                    const country = row.country;
                    const score = parseFloat(row.rating);
                    if (country && !isNaN(score)) {
                        if (!totals[country]) totals[country] = { sum: 0, count: 0 };
                        totals[country].sum += score;
                        totals[country].count += 1;
                    }
                });

                const sortedList = Object.keys(totals).map(c => ({
                    country: c,
                    avg: (totals[c].sum / totals[c].count).toFixed(1)
                })).sort((a, b) => b.avg - a.avg);

                document.getElementById('leaderboardBody').innerHTML = sortedList.map((item, i) => `
                    <tr class="hover:bg-purple-500/5 transition">
                        <td class="p-4 font-bold text-pink-400">#${i + 1}</td>
                        <td class="p-4 font-semibold">${item.country}</td>
                        <td class="p-4 text-right font-black text-yellow-400">${item.avg}</td>
                    </tr>
                `).join('');
            })
            .catch(err => console.error("Leaderboard fetch error:", err));
        }
    </script>
</body>
</html>
