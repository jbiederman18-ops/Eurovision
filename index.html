<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eurovision Ranker</title>

<style>

body{
  font-family:Arial;
  background:#111827;
  color:white;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:#1f2937;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}

.country{
  font-size:22px;
  font-weight:bold;
}

.song{
  opacity:0.7;
  margin-bottom:10px;
}

.stars button{
  font-size:24px;
  background:none;
  border:none;
  cursor:pointer;
}

.score{
  margin-top:10px;
  color:#facc15;
  font-weight:bold;
}

</style>
</head>

<body>

<h1>🎤 Eurovision 2026</h1>

<div id="app"></div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzkw4_5FSR9XOUpOILzv6o5KAJw6_kgIYvv2L0HwyFihcaZMk2Y7udXXKfYanfFR6YD/exec";

const VOTERS = [
  "Sarah",
  "Maria",
  "Erik",
  "Ryan",
  "Sam",
  "Mads",
  "Connor",
  "Josh"
];

const ACTS = [

  {
    id:1,
    flag:"🇩🇰",
    country:"Denmark",
    song:"Før Vi Går Hjem"
  },

  {
    id:2,
    flag:"🇩🇪",
    country:"Germany",
    song:"Fire"
  },

  {
    id:3,
    flag:"🇮🇱",
    country:"Israel",
    song:"Michelle"
  },

  {
    id:4,
    flag:"🇧🇪",
    country:"Belgium",
    song:"Dancing on the Ice"
  },

  {
    id:5,
    flag:"🇦🇱",
    country:"Albania",
    song:"Nân"
  }

];

let currentVoter = "Josh";

let ratings = {};

async function loadRatings(){

  const res = await fetch(API_URL);

  const data = await res.json();

  ratings = {};

  data.forEach(row => {

    if(!ratings[row.voter]){
      ratings[row.voter] = {};
    }

    ratings[row.voter][row.actId] =
      row.score;
  });

  render();
}

async function saveRating(
  actId,
  voter,
  score
){

  await fetch(API_URL, {

    method:"POST",

    headers:{
      "Content-Type":"text/plain"
    },

    body:JSON.stringify({
      actId,
      voter,
      score
    })
  });
}

function totalScore(actId){

  return VOTERS.reduce((sum,voter)=>{

    return sum +
      (ratings[voter]?.[actId] || 0);

  },0);
}

function render(){

  const app =
    document.getElementById("app");

  app.innerHTML = "";

  ACTS.forEach(act => {

    const div =
      document.createElement("div");

    div.className = "card";

    const myScore =
      ratings[currentVoter]?.[act.id] || 0;

    div.innerHTML = `

      <div class="country">
        ${act.flag} ${act.country}
      </div>

      <div class="song">
        ${act.song}
      </div>

      <div class="stars">
        ${[1,2,3,4,5].map(star => `
          <button
            onclick="
              rate(
                ${act.id},
                ${star}
              )
            "
          >
            ${
              star <= myScore
              ? "⭐"
              : "☆"
            }
          </button>
        `).join("")}
      </div>

      <div class="score">
        Total: ${totalScore(act.id)}
      </div>
    `;

    app.appendChild(div);
  });
}

async function rate(
  actId,
  score
){

  if(!ratings[currentVoter]){
    ratings[currentVoter] = {};
  }

  ratings[currentVoter][actId] =
    score;

  render();

  await saveRating(
    actId,
    currentVoter,
    score
  );
}

loadRatings();

</script>

</body>
</html>
